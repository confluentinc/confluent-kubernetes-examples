apiVersion: platform.confluent.io/v1beta1
kind: Gateway
metadata:
  labels:
    app.kubernetes.io/name: confluent-for-kubernetes
    app.kubernetes.io/managed-by: kustomize
  name: confluent-gateway
spec:
  replicas: 3
  image:
    application: confluentinc/cpc-gateway:1.4.0
    init: confluentinc/confluent-init-container:3.4.0
  streamingDomains:
    - name: ccloud-kafka
      type: kafka
      kafkaCluster:
        bootstrapServers:
          - id: CCLOUD_SASL_SSL
            # Replace with the bootstrap endpoint of your Confluent Cloud cluster
            # (Cluster Settings > Endpoints in the Confluent Cloud Console).
            endpoint: SASL_SSL://pkc-xxxxx.us-west-2.aws.confluent.cloud:9092
            tls:
              # Secret that holds the Let's Encrypt root CAs, created in Step 1.
              secretRef: ccloud-tls
  routes:
    - name: passthrough-oauth-ccloud-route
      endpoint: gateway.example.com:9595
      brokerIdentificationStrategy:
        type: host
        pattern: broker$(nodeId).gateway.example.com:9595
      streamingDomain:
        name: ccloud-kafka
        bootstrapServerId: CCLOUD_SASL_SSL
      security:
        client:
          authentication:
            type: oauth
          tls:
            secretRef: gateway-tls
        cluster:
          ccloud-kafka:
            auth: passthrough
            # SASL extensions that the Gateway adds to the client's OAUTHBEARER
            # handshake. Replace with your Confluent Cloud logical cluster ID
            # (lkc-...) so that clients don't have to set it.
            extensionHeaders:
              logicalCluster: lkc-xxxxx
  externalAccess:
    type: loadBalancer
    loadBalancer:
      domain: gateway.example.com
