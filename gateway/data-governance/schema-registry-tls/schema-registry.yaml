apiVersion: platform.confluent.io/v1beta1
kind: SchemaRegistry
metadata:
  name: schemaregistry
  namespace: confluent
spec:
  replicas: 1
  image:
    application: confluentinc/cp-schema-registry:8.4.0
    init: confluentinc/confluent-init-container:3.4.0
  tls:
    secretRef: schemaregistry-tls
  authentication:
    type: basic
    basic:
      secretRef: sr-basic-users
      roles:
        - sr-user
  dependencies:
    kafka:
      bootstrapEndpoint: kafka.confluent.svc.cluster.local:9071
