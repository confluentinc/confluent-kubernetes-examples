apiVersion: platform.confluent.io/v1beta1
kind: SchemaRegistry
metadata:
  name: schemaregistry
  namespace: confluent
spec:
  replicas: 1
  image:
    application: confluentinc/cp-schema-registry:8.4.0
    init: confluentinc/confluent-init-container:3.4.0
  authentication:
    type: basic
    basic:
      secretRef: sr-basic-users
      roles:
        - sr-user
  # Enables the rule-set extension. Without it, Schema Registry drops rule sets.
  configOverrides:
    server:
      - resource.extension.class=io.confluent.kafka.schemaregistry.rulehandler.RuleSetResourceExtension
  dependencies:
    kafka:
      bootstrapEndpoint: kafka.confluent.svc.cluster.local:9071
