apiVersion: platform.confluent.io/v1beta1
kind: USMAgent
metadata:
  name: usm-agent
  namespace: confluent
spec:
  replicas: 1
  image:
    application: docker.io/confluentinc/cp-usm-agent:1.3.0
    init: confluentinc/confluent-init-container:3.4.0
  # Basic authentication
  authentication:
    type: basic
    basic:
      secretRef: usm-basic-auth
  # TLS secret
  tls:
    secretRef: tls-usmagent
  confluentCloudClient:
    endpoint: <frontdoor_url>
    environmentId: <env_id>
    authentication:
      type: basic
      basic:
        secretRef: usm-ccloud-cred
  commandHandler:
    connectClusters:
      - connectClusterRef:
          name: connect-ext
        groupId: confluent.connect
        connectRest:
          endpoint: https://connect.confluent.svc.cluster.local:8083
          authentication:
            type: basic
            basic:
              secretRef: ch-connect-cred
          tls:
            secretRef: connect-ca
