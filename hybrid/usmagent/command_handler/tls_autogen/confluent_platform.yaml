apiVersion: platform.confluent.io/v1beta1
kind: KRaftController
metadata:
  name: kraftcontroller
  namespace: confluent
spec:
  dataVolumeCapacity: 10G
  image:
    application: docker.io/confluentinc/cp-server:8.4.0
    init: confluentinc/confluent-init-container:3.4.0
  replicas: 3
  tls:
    autoGeneratedCerts: true
  dependencies:
    usmAgentClient:
      url: https://usm-agent.confluent.svc.cluster.local:10000
      tls:
        enabled: true
---
apiVersion: platform.confluent.io/v1beta1
kind: Kafka
metadata:
  name: kafka
  namespace: confluent
spec:
  dataVolumeCapacity: 10G
  image:
    application: docker.io/confluentinc/cp-server:8.4.0
    init: confluentinc/confluent-init-container:3.4.0
  replicas: 3
  metricReporter:
    enabled: false
  tls:
    autoGeneratedCerts: true
  dependencies:
    kRaftController:
      clusterRef:
        name: kraftcontroller
    usmAgentClient:
      url: https://usm-agent.confluent.svc.cluster.local:10000
      tls:
        enabled: true
---
apiVersion: platform.confluent.io/v1beta1
kind: Connect
metadata:
  name: connect
  namespace: confluent
spec:
  build:
    type: onDemand
    onDemand:
      plugins:
        locationType: confluentHub
        confluentHub:
          - name: kafka-connect-datagen
            owner: confluentinc
            version: 0.5.2
  replicas: 1
  image:
    application: docker.io/confluentinc/cp-server-connect:8.4.0
    init: confluentinc/confluent-init-container:3.4.0
  tls:
    autoGeneratedCerts: true
  dependencies:
    kafka:
      bootstrapEndpoint: kafka:9071
    usmAgentClient:
      url: https://usm-agent.confluent.svc.cluster.local:10000
      tls:
        enabled: true
