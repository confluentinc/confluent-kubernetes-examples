apiVersion: platform.confluent.io/v1beta1
kind: KRaftController
metadata:
  name: kraftcontroller
  namespace: confluent
spec:
  replicas: 1
  dataVolumeCapacity: 10G
  image:
    application: confluentinc/cp-server:8.4.0
    init: confluentinc/confluent-init-container:3.4.0
  # Topics created without a replication factor get 3 replicas.
  configOverrides:
    server:
      - default.replication.factor=3
      - min.insync.replicas=2
  authorization:
    type: rbac
    superUsers:
      - User:kafka
      - User:mds
      - User:operator
  tls:
    autoGeneratedCerts: true
  listeners:
    controller:
      authentication:
        type: plain
        jaasConfig:
          secretRef: credential
      tls:
        enabled: true
  dependencies:
    mdsKafkaCluster:
      bootstrapEndpoint: kafka.confluent.svc.cluster.local:9071
      authentication:
        type: plain
        jaasConfig:
          secretRef: credential
      tls:
        enabled: true
    metricsClient:
      url: http://controlcenter.confluent.svc.cluster.local:9090
      authentication:
        type: basic
        basic:
          secretRef: prometheus-client-creds
