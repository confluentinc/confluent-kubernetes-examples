apiVersion: platform.confluent.io/v1beta1
kind: Kafka
metadata:
  name: kafka
  namespace: confluent
  annotations:
    # Wildcards for the LKC hostnames on the external listener:
    # bootstrap lkc-<id>-kafka.kafka.mt.example.com, brokers lkc-<id>-kafka.b<N>.mt.example.com
    platform.confluent.io/managed-cert-add-sans: "*.mt.example.com,*.kafka.mt.example.com,*.b0.mt.example.com,*.b1.mt.example.com,*.b2.mt.example.com"
spec:
  replicas: 3
  dataVolumeCapacity: 10G
  image:
    application: confluentinc/cp-server:8.4.0
    init: confluentinc/confluent-init-container:3.4.0
  # Multi-Tenancy needs a memory request or limit. Per-LKC quota limits
  # are derived from it, and brokers crash-loop with less than 4Gi.
  podTemplate:
    resources:
      requests:
        memory: 4Gi
      limits:
        memory: 4Gi
  multiTenant:
    enabled: true
  authorization:
    type: rbac
    superUsers:
      - User:kafka
      - User:mds
      - User:operator
  tls:
    autoGeneratedCerts: true
  listeners:
    internal:
      authentication:
        type: plain
        jaasConfig:
          secretRef: credential
      tls:
        enabled: true
    external:
      externalAccess:
        type: loadBalancer
        loadBalancer:
          domain: mt.example.com
      authentication:
        type: plain
        jaasConfig:
          secretRef: external-users
      tls:
        enabled: true
    replication:
      authentication:
        type: plain
        jaasConfig:
          secretRef: credential
      tls:
        enabled: true
  services:
    mds:
      tls:
        enabled: true
      tokenKeyPair:
        secretRef: mds-token
      provider:
        ldap:
          address: ldap://ldap.confluent.svc.cluster.local:389
          authentication:
            type: simple
            simple:
              secretRef: credential
          tls:
            enabled: false
          configurations:
            groupNameAttribute: cn
            groupObjectClass: group
            groupMemberAttribute: member
            groupMemberAttributePattern: CN=(.*),DC=test,DC=com
            groupSearchBase: dc=test,dc=com
            userNameAttribute: cn
            userObjectClass: organizationalRole
            userMemberOfAttributePattern: CN=(.*),DC=test,DC=com
            userSearchBase: dc=test,dc=com
  dependencies:
    kRaftController:
      clusterRef:
        name: kraftcontroller
      controllerListener:
        authentication:
          type: plain
          jaasConfig:
            secretRef: credential
        tls:
          enabled: true
    kafkaRest:
      authentication:
        type: bearer
        bearer:
          secretRef: mds-client-erp
    metricsClient:
      url: http://controlcenter.confluent.svc.cluster.local:9090
      authentication:
        type: basic
        basic:
          secretRef: prometheus-client-creds
