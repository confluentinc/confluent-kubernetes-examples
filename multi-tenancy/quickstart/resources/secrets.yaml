# Demo credentials. Don't use these outside a sandbox.
apiVersion: v1
kind: Secret
metadata:
  name: credential
  namespace: confluent
stringData:
  plain-users.json: '{"kafka":"kafka-secret","operator":"operator-secret","kafka_client":"kafka_client-secret"}'
  plain.txt: |-
    username=kafka
    password=kafka-secret
  plain-interbroker.txt: |-
    username=kafka
    password=kafka-secret
  kafka-server-listener-internal-plain-metrics.txt: |-
    username=kafka
    password=kafka-secret
  controlcenter-client-plain-jaas.conf: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="kafka" password="kafka-secret";'
  ldap.txt: |-
    username=cn=mds,dc=test,dc=com
    password=Developer!
---
# Users that LKC clients authenticate as on the external listener.
apiVersion: v1
kind: Secret
metadata:
  name: external-users
  namespace: confluent
stringData:
  plain-users.json: '{"platform-operator":"platform-operator-secret","payments-admin":"payments-admin-secret","analytics-admin":"analytics-admin-secret"}'
---
apiVersion: v1
kind: Secret
metadata:
  name: mds-client-erp
  namespace: confluent
stringData:
  bearer.txt: |-
    username=kafka
    password=kafka-secret
---
apiVersion: v1
kind: Secret
metadata:
  name: rest-credential
  namespace: confluent
stringData:
  bearer.txt: |-
    username=kafka
    password=kafka-secret
---
apiVersion: v1
