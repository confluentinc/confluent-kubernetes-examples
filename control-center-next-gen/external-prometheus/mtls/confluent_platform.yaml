apiVersion: platform.confluent.io/v1beta1
kind: KRaftController
metadata:
  name: kraftcontroller
  namespace: operator
spec:
  dataVolumeCapacity: 10G
  image:
    application: confluentinc/cp-server:8.4.0
    init: confluentinc/confluent-init-container:3.4.0
  replicas: 3
  dependencies:
    metricsClient:
      url: https://prometheus.example.com:9090
      authentication:
        type: mtls
      tls:
        enabled: true
        secretRef: prometheus-client-tls
---
apiVersion: platform.confluent.io/v1beta1
kind: Kafka
metadata:
  name: kafka
  namespace: operator
spec:
  dependencies:
    kRaftController:
      clusterRef:
        name: kraftcontroller
    metricsClient:
      url: https://prometheus.example.com:9090
      authentication:
        type: mtls
      tls:
        enabled: true
        secretRef: prometheus-client-tls
  dataVolumeCapacity: 10G
  image:
    application: confluentinc/cp-server:8.4.0
    init: confluentinc/confluent-init-container:3.4.0
  replicas: 3
---
apiVersion: platform.confluent.io/v1beta1
kind: ControlCenter
metadata:
  name: controlcenter-next-gen
  namespace: operator
spec:
  replicas: 1
  image:
    application: confluentinc/cp-enterprise-control-center-next-gen:2.7.0
    init: confluentinc/confluent-init-container:3.4.0
  dataVolumeCapacity: 10Gi
  dependencies:
    prometheusClient:
      url: https://prometheus.example.com:9090
      authentication:
        type: mtls
      tls:
        enabled: true
        secretRef: prometheus-client-tls
      tlsClientAliasName: "1"
  services:
    prometheus:
      enabled: false
    alertmanager:
      enabled: false
